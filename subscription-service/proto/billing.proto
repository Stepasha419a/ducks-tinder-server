syntax="proto3";

package billing;
option go_package = "./gen";

service BillingService {
  rpc HandleUserPurchase (HandleUserPurchaseRequest) returns (Purchase);
}

message HandleUserPurchaseRequest {
  string userId       = 1;
  int64  amount       = 3;
}

message Purchase {
  string id           = 1;
  string userId       = 2;
  int64  amount       = 4;
  int64  createdAt    = 5;
}
